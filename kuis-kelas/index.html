<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243c35">
  <title>Kuis Kelas</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20332c;
      --muted: #53665c;
      --line: #d8e1d7;
      --paper: #fff;
      --back: #f3f5ef;
      --green: #245c47;
      --pale: #eaf4eb;
      --red: #a13327;
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--back); color: var(--ink); }
    [hidden] { display: none !important; }
    .mast { background: #203b32; color: white; }
    .wrap { width: min(100% - 2rem, 56rem); margin-inline: auto; }
    .mast .wrap { min-height: 3.8rem; display: flex; align-items: center; gap: .65rem; font-weight: 750; }
    .mark { width: 1.55rem; height: 1.55rem; border: 2px solid #c5e6c3; border-radius: .4rem; position: relative; }
    .mark::after { content: ""; position: absolute; width: .65rem; height: .38rem; border: solid #c5e6c3; border-width: 0 0 2px 2px; inset: .38rem .27rem; transform: rotate(-45deg); }
    main.wrap { padding-block: 2.1rem 3.5rem; }
    header { margin-bottom: 1.4rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.047em; line-height: 1.08; margin: 0 0 .7rem; max-width: 18ch; }
    h2, p { margin: 0; }
    header p, .hint, .meta, .progress-copy, .bank-description { color: var(--muted); }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 1rem; padding: clamp(1rem, 3vw, 1.55rem); min-width: 0; }
    .notice { padding: .8rem 1rem; margin-bottom: 1rem; border-radius: .65rem; background: #faf1dc; color: #60471d; }
    .identity, .quiz-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 2rem; align-items: center; }
    .identity .full { grid-column: 1 / -1; }
    .identity .actions { margin-top: 0; }
    .identity label, .quiz-tools label, .progress-copy { display: block; font-weight: 700; margin-bottom: .35rem; }
    .quiz-tools { position: sticky; top: .45rem; z-index: 1; box-shadow: 0 .25rem 1.15rem #203b3214; }
    progress { width: 100%; height: .65rem; vertical-align: middle; appearance: none; border: 0; border-radius: 1rem; color: var(--green); background: var(--pale); overflow: hidden; }
    progress::-webkit-progress-bar { background: var(--pale); }
    progress::-webkit-progress-value { background: var(--green); }
    progress::-moz-progress-bar { background: var(--green); }
    input, select, button { font: inherit; }
    input[type="text"], select { color: var(--ink); width: 100%; min-height: 2.8rem; background: #fff; border-radius: .55rem; border: 1px solid #aebcb0; padding: .55rem .75rem; }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--green); height: 1.15rem; width: 1.15rem; margin: .16rem 0 0; flex: none; }
    :focus-visible { outline: 3px solid #2b7355; outline-offset: 3px; }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    .questions { display: grid; gap: 1rem; margin-top: 1rem; }
    .question { scroll-margin-block-start: 8rem; }
    .question.invalid { border-color: #cc695e; }
    .number { display: inline-grid; place-items: center; min-width: 1.9rem; height: 1.9rem; background: var(--pale); border-radius: .45rem; color: var(--green); flex: none; font-size: .9rem; }
    .meta { margin-bottom: .55rem; font-size: .85rem; font-weight: 650; }
    legend { padding: 0; width: 100%; font-size: 1.12rem; font-weight: 750; }
    .question-title { display: flex; gap: .65rem; align-items: flex-start; white-space: pre-line; }
    .hint { margin-top: .5rem; font-size: .92rem; }
    .question-image { display: block; max-width: 100%; width: auto; height: auto; max-height: 20rem; object-fit: contain; margin: .85rem 0 0; border: 1px solid var(--line); border-radius: .6rem; }
    .reading { margin: 0 0 1.05rem; padding: .8rem; background: var(--back); border: 1px solid var(--line); border-radius: .65rem; overflow-wrap: anywhere; }
    .reading h2 { margin-bottom: .5rem; color: var(--green); font-size: 1rem; }
    .reading p + p { margin-top: .7rem; }
    .question-navigation { justify-content: space-between; }
    .options { display: grid; gap: .5rem; margin-top: .8rem; }
    .choice { display: flex; align-items: flex-start; gap: .65rem; padding: .65rem .8rem; min-height: 2.8rem; border: 1px solid var(--line); border-radius: .55rem; cursor: pointer; }
    .choice:hover, .choice:has(:checked) { border-color: #72a58b; background: var(--pale); }
    .pair { display: grid; gap: .35rem .8rem; grid-template-columns: 1fr 1fr; align-items: center; }
    .error { margin-top: .45rem; color: var(--red); font-weight: 650; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
    button { padding: .68rem 1rem; border: 1px solid transparent; border-radius: .55rem; color: white; background: var(--green); font-weight: 720; cursor: pointer; min-height: 2.8rem; }
    button:hover { background: #1a4635; }
    button.secondary { background: white; color: var(--green); border-color: #75a28a; }
    button.secondary:hover { background: var(--pale); }
    button:disabled { cursor: default; opacity: .65; }
    #result:focus { outline-offset: 4px; }
    .result-card { padding: clamp(1.25rem, 5vw, 2.25rem); }
    .score { font-size: clamp(3rem, 10vw, 5.25rem); line-height: 1.1; font-weight: 800; letter-spacing: -.055em; color: var(--green); margin-block: .4rem; }
    .score span { font-size: .36em; color: var(--muted); letter-spacing: 0; }
    #save-status { margin-top: 1rem; }
    @media (max-width: 36rem) {
      main.wrap { padding-top: 1.5rem; }
      .identity, .pair { grid-template-columns: 1fr; }
      .quiz-tools { gap: .75rem; }
      .quiz-tools label, .progress-copy { font-size: .9rem; }
      .pair { margin-bottom: .35rem; }
    }
  </style>
</head>
<body>
  <div class="mast">
    <div class="wrap"><span class="mark" aria-hidden="true"></span> Kuis Kelas</div>
  </div>
  <main class="wrap">
    <header>
      <h1 id="quiz-title" tabindex="-1">Kuis Kelas</h1>
      <p id="quiz-description">Masukkan nama, lalu pilih kelas dan mata pelajaran.</p>
    </header>

    <p id="preview-notice" class="notice" hidden>Mode pratinjau. Nilai tampil di perangkat ini. Pengiriman ke Spreadsheet aktif setelah guru memasang URL Apps Script.</p>

    <form id="setup">
      <div class="card identity">
        <div class="full">
          <label for="student-name">Nama lengkap</label>
          <input id="student-name" type="text" autocomplete="name" maxlength="100" placeholder="Ketik nama lengkap" required aria-describedby="name-error">
          <p id="name-error" class="error" hidden>Isi nama lengkap Anda.</p>
        </div>
        <div>
          <label for="school-class">Kelas</label>
          <select id="school-class" required></select>
        </div>
        <div>
          <label for="subject">Mata pelajaran</label>
          <select id="subject" required disabled></select>
        </div>
        <p id="bank-description" class="bank-description full" aria-live="polite" hidden></p>
        <div class="actions full">
          <button id="start" type="submit" disabled>Mulai kuis</button>
        </div>
      </div>
    </form>

    <form id="quiz" novalidate hidden>
      <div class="card quiz-tools">
        <div>
          <p id="question-position" class="progress-copy"></p>
          <div class="progress-copy" id="progress-copy"></div>
          <progress id="progress" value="0" aria-labelledby="progress-copy"></progress>
        </div>
        <div>
          <label for="jump">Ke nomor soal</label>
          <select id="jump"></select>
        </div>
      </div>
      <div id="questions" class="questions"></div>
      <div class="actions question-navigation">
        <button id="previous" class="secondary" type="button">Sebelumnya</button>
        <button id="next" type="button">Selanjutnya</button>
        <button id="finish" type="submit" hidden>Kumpulkan jawaban</button>
      </div>
      <p id="form-error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="card result-card" tabindex="-1" hidden aria-labelledby="result-title">
      <h2 id="result-title">Nilai kuis</h2>
      <p class="score" id="score"></p>
      <p id="result-detail"></p>
      <p id="save-status" role="status"></p>
      <div class="actions">
        <button id="retry" type="button" hidden>Kirim ulang nilai</button>
        <button id="google-receipt" class="secondary" type="button" hidden>Kirim lewat tab Google</button>
        <button id="restart" class="secondary" type="button" hidden>Mulai kuis baru</button>
      </div>
    </section>
    <form id="direct-submit" method="post" target="_blank" hidden></form>
  </main>

  "ceritaDompet": {
    "judul": "Dompet di Dekat Halte",
    "paragraf": [
      "Hujan turun cukup deras ketika Raka berjalan kaki pulang dari sekolah. Di dekat halte tua yang sepi, matanya tertumbuk pada sebuah dompet kulit berwarna cokelat yang tergeletak di genangan air. Raka segera memungutnya dan berteduh di bawah atap halte. Saat membukanya untuk mencari kartu identitas pemiliknya, napas Raka sempat tercekat. Di dalamnya terdapat beberapa lembar uang seratus ribuan yang cukup banyak.",
      "Pikiran Raka mendadak berkecamuk. Ia teringat ibunya di rumah yang sejak kemarin batuk-batuk dan belum sempat membeli obat karena uang belanja menipis. 'Kalau aku ambil sedikit saja, mungkin pemiliknya tidak sadar,' bisik hati kecilnya. Namun, Raka segera menggelengkan kepala kuat-kuat. Ia teringat pesan almarhum ayahnya bahwa rezeki yang tidak jujur tidak akan pernah membawa ketenangan.",

  "ceritaKebun": {
    "judul": "Kebun Kakek",
    "paragraf": [
      "Sejak matahari mulai menampakkan senyumnya di ufuk timur, aku dan Kakek sudah sibuk di kebun belakang rumah. Pagi itu udara terasa sejuk. Angin berbisik pelan di antara dedaunan mangga yang melambai-lambai menyambut hari baru. Kakek memang dikenal sebagai petani yang ulet; ia selalu banting tulang merawat tanaman sayur agar hasil panennya melimpah.",
      "Di sudut kebun, tiba-tiba terdengar suara ribut dari arah kandang ayam. Seekor musang liar hampir saja menerkam anak ayam kesayanganku. Kakek segera berlari membawa sebatang bambu. Rasanya, Kakek menempuh seribu langkah dalam satu kedipan mata. Musang tersebut lari terbirit-birit menembus pagar semak.",

  "ceritaLomba": {
    "judul": "Persiapan Lomba Kebersihan",
    "paragraf": [

      "Sikap Bima membuat teman-temannya kesal. Sari hampir saja memarahinya, tetapi Dito menahannya dengan tenang. Dito menghampiri Bima dan mengajaknya berdiskusi baik-baik. Dito menjelaskan bahwa mempertahankan gelar juara jauh lebih sulit daripada meraihnya, apalagi kelas lain kini berbenah jauh lebih rapi.",

    const infoBank = get("bank-description");
    const jump = get("jump");
    const previous = get("previous");
    const next = get("next");
    const finish = get("finish");
    const result = get("result");
    const retry = get("retry");
    const receipt = get("google-receipt");
    const restart = get("restart");
    const siapKirim = /^https:\/\/script\.google\.com\/(?:macros|a\/macros\/[a-z\d.-]+)\/s\/[\w-]+\/exec\/?$/i.test(WEB_APP_URL);
    let pengiriman;
    let bankAktif;
    let itemSoal = [];
    let indeksAktif = 0;

    function buatPilihan(opsi, tipeInput, id) {
      return opsi.map((teks, indeks) => {
        const kontrol = buat("input");
        kontrol.type = tipeInput;
        kontrol.name = id;
        kontrol.value = String(indeks);
        const label = buat("label", "choice");
        label.append(kontrol, buat("span", "", teks));
        return label;
      });
    }

    function buatPasangan(label, opsi, indeks, id) {
      const wadah = buat("div", "pair");
      const pilih = buat("select");
      pilih.id = id + "-" + indeks;
      pilih.add(new Option("Pilih jawaban", ""));
      opsi.forEach((teks, nomor) => pilih.add(new Option(teks, String(nomor))));
      const keterangan = buat("label", "", label);
      keterangan.htmlFor = pilih.id;
      wadah.append(keterangan, pilih);
      return wadah;
    }

    function buatGambar(data) {
      const gambar = buat("img", "question-image");
      gambar.alt = data.alt;
      gambar.src = data.src;
      return gambar;
    }

    function buatBacaan(bacaan) {
      const wadah = buat("div", "reading");
      wadah.append(buat("h2", "", bacaan.judul), ...bacaan.paragraf.map((teks) => buat("p", "", teks)));
      if (bacaan.gambar) wadah.append(buatGambar(bacaan.gambar));
      return wadah;
    }

    function buatSoal(soal, indeks) {
      const id = "soal-" + (indeks + 1);
      const [jenis, petunjuk] = infoTipe[soal.tipe];
      const kartu = buat("section", "card question");
      kartu.hidden = true;
      kartu.tabIndex = -1;
      kartu.setAttribute("aria-label", "Soal " + (indeks + 1));
      const grup = buat("fieldset");
      const judul = buat("legend");
      const judulDalam = buat("span", "question-title");
      judulDalam.append(buat("span", "number", indeks + 1), buat("span", "", soal.soal));
      judul.append(judulDalam);
      const arahan = buat("p", "hint", petunjuk);
      arahan.id = id + "-hint";
      const galat = buat("p", "error");
      galat.id = id + "-error";
      galat.hidden = true;
      grup.setAttribute("aria-describedby", arahan.id + " " + galat.id);
      grup.append(judul, arahan);

      const opsi = buat("div", "options");
      switch (soal.tipe) {
        case "pilihan":
        case "kompleks":
        case "benar_salah": {
          const pilihan = soal.tipe === "benar_salah" ? ["Benar", "Salah"] : soal.opsi;
          opsi.append(...buatPilihan(pilihan, soal.tipe === "kompleks" ? "checkbox" : "radio", id));
          break;
        }
        case "isian":
        case "angka": {
          const kolom = buat("input");
          kolom.type = "text";
          kolom.autocomplete = "off";
          kolom.maxLength = soal.tipe === "angka" ? 40 : 250;
          if (soal.tipe === "angka") kolom.inputMode = "decimal";
          kolom.setAttribute("aria-label", "Jawaban soal " + (indeks + 1));
          opsi.append(kolom);
          break;
        }
        case "menjodohkan":
        case "urutan": {
          const label = soal.tipe === "menjodohkan"
            ? soal.kiri
            : soal.opsi.map((_, nomor) => "Urutan " + (nomor + 1));
          opsi.append(...label.map((teks, nomor) => buatPasangan(teks, soal.opsi, nomor, id)));
          break;
        }
      }
      grup.append(opsi, galat);
      kartu.append(buat("p", "meta", jenis));
      if (soal.stimulus) kartu.append(buatBacaan(BACAAN[soal.stimulus]));
      if (soal.gambar) kartu.append(buatGambar(soal.gambar));
      kartu.append(grup);
      return { soal, kartu, galat, kontrol: [...opsi.querySelectorAll("input, select")] };
    }

    function ambilJawaban({ soal, kontrol }) {
      switch (soal.tipe) {
        case "pilihan":
        case "benar_salah":
          return kontrol.find((elemen) => elemen.checked)?.value ?? null;
        case "kompleks":
          return kontrol.filter((elemen) => elemen.checked).map((elemen) => Number(elemen.value));
        case "menjodohkan":
        case "urutan":
          return kontrol.map((elemen) => elemen.value === "" ? null : Number(elemen.value));
        default:
          return kontrol[0].value.trim();
      }
    }

    function cekLengkap(soal, jawaban) {
      if (jawaban === null || jawaban === "" || (Array.isArray(jawaban) && (!jawaban.length || jawaban.includes(null)))) {
        return "Lengkapi jawaban pada soal ini.";
      }
      if (soal.tipe === "urutan" && new Set(jawaban).size !== jawaban.length) {
        return "Gunakan setiap opsi satu kali.";
      }
      if (soal.tipe === "angka" && !/^[+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(jawaban)) {
        return "Masukkan angka yang valid.";
      }
      return "";
    }

    function normalisasi(teks) {
      return teks.normalize("NFC").trim().replace(/\s+/g, " ").toLocaleLowerCase("id");
    }

    function jawabanBenar(soal, jawaban) {
      switch (soal.tipe) {
        case "pilihan":
          return Number(jawaban) === soal.kunci;
        case "benar_salah":
          return (jawaban === "0") === soal.kunci;
        case "isian":
          return soal.kunci.some((kunci) => normalisasi(kunci) === normalisasi(jawaban));
        case "angka": {
          const angka = Number(jawaban.replace(",", "."));
          const toleransi = soal.toleransi ?? 0;
          const pembulatan = toleransi > 0 ? Number.EPSILON * Math.max(1, Math.abs(soal.kunci)) : 0;
          return Math.abs(angka - soal.kunci) <= toleransi + pembulatan;
        }
        case "kompleks":
          return jawaban.length === soal.kunci.length && soal.kunci.every((kunci) => jawaban.includes(kunci));
        case "menjodohkan":
        case "urutan":
          return soal.kunci.every((kunci, indeks) => jawaban[indeks] === kunci);
      }
    }

    function tampilkanGalat(item, pesan) {
      item.galat.textContent = pesan;
      item.galat.hidden = !pesan;
      item.kartu.classList.toggle("invalid", Boolean(pesan));
    }

    function perbaruiProgres() {
      const jumlah = itemSoal.filter((item) => !cekLengkap(item.soal, ambilJawaban(item))).length;
      get("progress").value = jumlah;
      get("progress-copy").textContent = jumlah + " dari " + itemSoal.length + " soal dijawab";
    }

    function bukaSoal(indeks) {
      const item = itemSoal[indeks];
      if (!item) return;
      itemSoal[indeksAktif].kartu.hidden = true;
      indeksAktif = indeks;
      item.kartu.hidden = false;
      jump.value = String(indeks);
      get("question-position").textContent = "Soal " + (indeks + 1) + " dari " + itemSoal.length;
      previous.disabled = indeks === 0;
      next.hidden = indeks === itemSoal.length - 1;
      finish.hidden = !next.hidden;
      get("form-error").hidden = true;
      item.kartu.scrollIntoView({ block: "start" });
      item.kartu.focus({ preventScroll: true });
    }

    function muatan(mode) {
      return new URLSearchParams({
        nama: pengiriman.nama,
        nilai: String(pengiriman.nilai),
        kiriman: pengiriman.id,
        mode,
      });
    }

    async function kirimNilai() {
      retry.hidden = true;
      receipt.hidden = true;
      const status = get("save-status");
      status.textContent = "Mengirim nilai ke Spreadsheet…";
      const controller = new AbortController();
      const batas = setTimeout(() => controller.abort(), 20000);
      try {
        const respons = await fetch(WEB_APP_URL, {
          method: "POST",
          body: muatan("json"),
          credentials: "omit",
          signal: controller.signal,
        });
        if (!respons.ok) throw new Error("Respons Google tidak dapat dibaca.");
        const data = await respons.json();
        if (data.service !== "kuis-kelas-v1" || data.kiriman !== pengiriman.id) {
          throw new Error("Respons Google tidak dapat diverifikasi.");
        }
        if (!data.ok || data.nilai !== pengiriman.nilai) {
          status.textContent = data.pesan || "Nilai belum dapat dikonfirmasi.";
          retry.hidden = false;
          receipt.hidden = false;
          return;
        }
        status.textContent = "Nilai berhasil tersimpan di Spreadsheet.";
        restart.hidden = false;
      } catch {
        status.textContent = "Penyimpanan belum dapat dikonfirmasi. Coba kirim ulang atau buka tab Google untuk melihat tanda terima.";
        retry.hidden = false;
        receipt.hidden = false;
      } finally {
        clearTimeout(batas);
      }
    }

    get("preview-notice").hidden = siapKirim;
    const daftarKelas = [...new Set(BANK_SOAL.map((bank) => bank.kelas))];
    kelas.add(new Option("Pilih kelas", ""));
    daftarKelas.forEach((label) => kelas.add(new Option("Kelas " + label, label)));

    function pilihBank() {
      return BANK_SOAL.find((bank) => bank.kelas === kelas.value && bank.mapel === mapel.value);
    }

    function tampilkanPilihanMapel() {
      mapel.replaceChildren(new Option("Pilih mata pelajaran", ""));
      BANK_SOAL.filter((bank) => bank.kelas === kelas.value).forEach((bank) => {
        mapel.add(new Option(bank.mapel, bank.mapel));
      });
      mapel.disabled = !kelas.value;
      mulai.disabled = true;
      infoBank.hidden = true;
    }

    tampilkanPilihanMapel();
    kelas.addEventListener("change", tampilkanPilihanMapel);
    mapel.addEventListener("change", () => {
      const bank = pilihBank();
      mulai.disabled = !bank;
      infoBank.hidden = !bank;
      if (bank) infoBank.textContent = bank.soal.length + " soal. Jawab semua soal sebelum mengumpulkan.";
    });
    nama.addEventListener("input", () => {
      get("name-error").hidden = true;
      nama.removeAttribute("aria-invalid");
    });
    jump.addEventListener("change", () => bukaSoal(Number(jump.value)));
    previous.addEventListener("click", () => bukaSoal(indeksAktif - 1));
    next.addEventListener("click", () => bukaSoal(indeksAktif + 1));

    setup.addEventListener("submit", (event) => {
      event.preventDefault();
      bankAktif = pilihBank();
      if (!bankAktif) return;
      if (!nama.value.trim()) {
        get("name-error").hidden = false;
        nama.setAttribute("aria-invalid", "true");
        nama.focus();
        return;
      }

      jump.replaceChildren();
      indeksAktif = 0;
      itemSoal = bankAktif.soal.map((soal, indeks) => {
        const item = buatSoal(soal, indeks);
        jump.add(new Option("Soal " + (indeks + 1), String(indeks)));
        item.kartu.addEventListener("input", () => {
          if (!item.galat.hidden) {
            const pesan = cekLengkap(item.soal, ambilJawaban(item));
            tampilkanGalat(item, pesan);
            if (!pesan) get("form-error").hidden = true;
          }
          perbaruiProgres();
        });
        return item;
      });
      get("questions").replaceChildren(...itemSoal.map((item) => item.kartu));
      get("progress").max = itemSoal.length;
      perbaruiProgres();
      get("quiz-title").textContent = bankAktif.mapel;
      get("quiz-description").textContent = "Kelas " + bankAktif.kelas + " · " + nama.value.trim();
      document.title = bankAktif.mapel + " Kelas " + bankAktif.kelas + " | Kuis Kelas";
      setup.hidden = true;
      quiz.hidden = false;
      bukaSoal(0);
    });

    quiz.addEventListener("submit", (event) => {
      event.preventDefault();
      if (pengiriman || !bankAktif || quiz.hidden || finish.hidden) return;
      const namaSiswa = nama.value.trim().replace(/\s+/g, " ");
      let belumLengkap = -1;
      let benar = 0;
      let bobotBenar = 0;
      let bobotTotal = 0;
      itemSoal.forEach((item, indeks) => {
        const jawaban = ambilJawaban(item);
        const pesan = cekLengkap(item.soal, jawaban);
        tampilkanGalat(item, pesan);
        const bobot = item.soal.bobot ?? 1;
        bobotTotal += bobot;
        if (pesan) {
          if (belumLengkap === -1) belumLengkap = indeks;
        } else if (jawabanBenar(item.soal, jawaban)) {
          benar++;
          bobotBenar += bobot;
        }
      });
      if (belumLengkap !== -1) {
        bukaSoal(belumLengkap);
        get("form-error").textContent = "Jawab soal ini sebelum mengumpulkan.";
        get("form-error").hidden = false;
        return;
      }

      const nilai = Math.round(bobotBenar / bobotTotal * 100);
      pengiriman = { nama: namaSiswa, nilai, id: siapKirim ? crypto.randomUUID() : "" };
      get("score").replaceChildren(document.createTextNode(nilai + " "), buat("span", "", "/ 100"));
      get("result-detail").textContent = namaSiswa + " · Kelas " + bankAktif.kelas + " · " + benar + " dari " + itemSoal.length + " soal benar";
      quiz.hidden = true;
      result.hidden = false;
      result.focus();
      if (siapKirim) {
        kirimNilai();
      } else {
        get("save-status").textContent = "Nilai pratinjau. Pengiriman ke Spreadsheet belum diaktifkan.";
        restart.hidden = false;
      }
    });

    retry.addEventListener("click", kirimNilai);
    receipt.addEventListener("click", () => {
      const formulir = get("direct-submit");
      formulir.action = WEB_APP_URL;
      formulir.replaceChildren();
      for (const [kunci, nilai] of muatan("html")) {
        const kolom = buat("input");
        kolom.type = "hidden";
        kolom.name = kunci;
        kolom.value = nilai;
        formulir.append(kolom);
      }
      formulir.submit();
      get("save-status").textContent = "Lihat tab Google untuk memeriksa hasil penyimpanan.";
      restart.hidden = false;
    });
    restart.addEventListener("click", () => {
      pengiriman = null;
      bankAktif = null;
      itemSoal = [];
      get("questions").replaceChildren();
      setup.reset();
      tampilkanPilihanMapel();
      setup.hidden = false;
      result.hidden = true;
      retry.hidden = receipt.hidden = restart.hidden = true;
      get("quiz-title").textContent = "Kuis Kelas";
      get("quiz-description").textContent = "Masukkan nama, lalu pilih kelas dan mata pelajaran.";
      document.title = "Kuis Kelas";
      nama.focus();
    });
  </script>
</body>
</html>
